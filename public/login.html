<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css?family=Josefin+Sans:300,400,400i|Nunito:300,300i"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="shortcut icon" href="css/favicon.svg" />
    <title>Login | Betlink</title>
  </head>
  <body class="container container--page">
    <header class="header">
      <a href="homepage.html">
        <img
          class="header__logo"
          src="./img/logos/betoch-wordmark.svg"
          alt="BETOCH logo"
        />
      </a>

      <!-- Hamburger Menu Button -->
      <button
        class="header__hamburger"
        id="hamburger-btn"
        aria-label="Toggle menu"
      >
        <span class="header__hamburger-line"></span>
        <span class="header__hamburger-line"></span>
        <span class="header__hamburger-line"></span>
      </button>

      <nav class="header__nav" id="main-nav">
        <a href="listings.html" class="header__nav--btn header__nav--browse">
          <svg class="header__nav--icon">
            <use xlink:href="./css/icons-sprite.svg#icon-search"></use>
          </svg>
          Browse Listings
        </a>
        <a
          href="post-listing.html"
          class="header__nav--btn header__nav--listing"
        >
          <svg class="header__nav--icon">
            <use xlink:href="./css/icons-sprite.svg#icon-home"></use>
          </svg>
          Add Listing
        </a>
        <span class="header__nav--divider"></span>
        <a href="login.html" class="header__nav--btn header__nav--login"
          >Login</a
        >
        <a href="signup.html" class="header__nav--btn header__nav--signup"
          >Sign Up</a
        >
      </nav>
    </header>

    <section class="auth">
      <div class="auth__card">
        <a href="homepage.html">
          <img
            class="auth__logo"
            src="./img/logos/betoch-wordmark.svg"
            alt="BetLink logo"
          />
        </a>

        <nav class="auth__tabs" aria-label="Authentication">
          <a href="login.html" class="auth__tab auth__tab--active">Login</a>
          <a href="signup.html" class="auth__tab">Sign up</a>
        </nav>

        <h1 class="auth__title">Welcome back</h1>
        <p class="auth__subtitle">
          Sign in to manage your listings and connect with tenants.
        </p>

        <form action="dashboard.html">
          <div class="form__group">
            <label class="form__label" for="email">Email address</label>
            <input
              type="email"
              id="email"
              class="form__input"
              placeholder="you@example.com"
              required
            />
          </div>
          <div class="form__group">
            <label class="form__label" for="password">Password</label>
            <input
              type="password"
              id="password"
              class="form__input"
              placeholder="Enter your password"
              required
            />
          </div>
          <div class="form__group form__checkbox">
            <input type="checkbox" id="remember" />
            <label for="remember">Keep me signed in</label>
          </div>
          <button type="submit" class="btn btn--primary btn--block">
            Sign in
          </button>
        </form>

        <p class="auth__footer-text">
          Don't have an account?
          <a href="signup.html">Create one free</a>
        </p>
      </div>
    </section>

    <script>
      // Hamburger menu toggle
      const hamburger = document.getElementById("hamburger-btn");
      const nav = document.getElementById("main-nav");

      hamburger.addEventListener("click", () => {
        hamburger.classList.toggle("active");
        nav.classList.toggle("active");
      });

      // Close mobile menu when clicking outside
      document.addEventListener("click", (e) => {
        if (!nav.contains(e.target) && !hamburger.contains(e.target)) {
          hamburger.classList.remove("active");
          nav.classList.remove("active");
        }
      });
    </script>
  </body>
</html>
